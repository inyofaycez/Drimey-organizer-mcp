# Merge this into ~/.vibe/config.toml and replace every example path.

[[mcp_servers]]
name = "drime"
transport = "stdio"
command = "/opt/homebrew/bin/python3"
args = ["/Users/YOU/Applications/drimey-organizer-mcp/server.py"]
env = { DRIME_MCP_REMOTE = "drime-mcp:", RCLONE_BIN = "/opt/homebrew/bin/rclone", RCLONE_CONFIG = "/Users/YOU/.config/rclone/drime-mcp.conf", DRIME_MCP_INDEX = "/Users/YOU/Library/Caches/drime-organizer-mcp/index.json", DRIME_MCP_AUDIT = "/Users/YOU/Library/Logs/drime-organizer-mcp/audit.jsonl" }
startup_timeout_sec = 15
tool_timeout_sec = 900

[tools.drime_list_folder]
permission = "always"

[tools.drime_get_info]
permission = "always"

[tools.drime_refresh_index]
permission = "always"

[tools.drime_search_index]
permission = "always"

[tools.drime_read_text]
permission = "always"

[tools.drime_plan_organization]
permission = "always"

[tools.drime_execute_organization_plan]
permission = "ask"

